server:
  port: 0

spring:
  task:
    scheduling:
      enabled: false
  datasource:
    url: ${E2E_DATASOURCE_URL:jdbc:mysql://localhost:3306/rabbit_app_e2e?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${E2E_DATASOURCE_USERNAME:root}
    password: ${E2E_DATASOURCE_PASSWORD:rabbit_root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    clean-disabled: false
    baseline-on-migrate: true
    baseline-version: 0

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  cache:
    provider: redis
    host: 127.0.0.1
  auth:
    phone-hash-secret: e2e-only-phone-hash-secret-0123456789abcdef
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,https://admin.dzht.top
  jwt:
    secret: e2e-only-app-jwt-secret-0123456789abcdef
    expire-seconds: 604800
  admin:
    jwt:
      secret: e2e-only-admin-jwt-secret-0123456789abcdef
      expire-seconds: 604800
    bootstrap:
      enabled: true
      username: admin
      password: admin123456
  wechat:
    enabled: false
  sms:
    enabled: true
    code-secret: e2e-only-sms-code-secret-0123456789abcdef
  hardware:
    enabled: false
    gateway: noop
    http:
      base-url:
      token:
      connect-timeout-ms: 3000
      read-timeout-ms: 5000
  breeding-performance:
    recalc:
      enabled: false
  cage:
    commodity-capacity: 10
  mybatis:
    write-guard:
      max-affected-rows: 2000
      ignore-row-limit-ids:
      ignore-no-where-ids:
    select-guard:
      enabled: true
      ignore-ids: com.rabbit.app.modules.house.mapper.RabbitHouseMapper.selectById
  inventory:
    forbid-negative: true
    cas-retry-times: 5

logging:
  level:
    root: WARN
    com.rabbit.app: INFO
