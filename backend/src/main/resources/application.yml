server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/rabbit_app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: rabbit-app-dev-secret-change-me
    expire-seconds: 604800
  wechat:
    enabled: false
    appid:
    secret:
  hardware:
    enabled: false
    gateway: noop
    http:
      base-url:
      token:
      connect-timeout-ms: 3000
      read-timeout-ms: 5000
  breeding-performance:
    recalc:
      enabled: false
  cage:
    commodity-capacity: 10
  mybatis:
    write-guard:
      max-affected-rows: 2000
      ignore-row-limit-ids:
      ignore-no-where-ids:
    select-guard:
      enabled: true
      ignore-ids:
  inventory:
    forbid-negative: false
    cas-retry-times: 5

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{traceId}] %msg%n"
