server:
  port: 8080
  forward-headers-strategy: ${APP_FORWARD_HEADERS_STRATEGY:none}

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/rabbit_app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  cache:
    provider: ${APP_CACHE_PROVIDER:none}
    host: ${APP_CACHE_HOST:127.0.0.1}
    port: ${APP_CACHE_PORT:6379}
    username: ${APP_CACHE_USERNAME:}
    password: ${APP_CACHE_PASSWORD:}
    database: ${APP_CACHE_DATABASE:0}
    ssl-enabled: ${APP_CACHE_SSL_ENABLED:false}
    connect-timeout: ${APP_CACHE_CONNECT_TIMEOUT:2s}
    command-timeout: ${APP_CACHE_COMMAND_TIMEOUT:1s}
    key-prefix: ${APP_CACHE_KEY_PREFIX:rabbit:cache:v1}
  auth:
    phone-hash-secret: ${APP_PHONE_HASH_SECRET:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://admin.dzht.top,https://rabbit.host.dzht.top}
  jwt:
    secret: ${APP_JWT_SECRET:}
    expire-seconds: 604800
  admin:
    jwt:
      secret: ${APP_ADMIN_JWT_SECRET:}
      expire-seconds: ${APP_ADMIN_JWT_EXPIRE_SECONDS:${app.jwt.expire-seconds}}
    bootstrap:
      enabled: ${APP_ADMIN_BOOTSTRAP_ENABLED:true}
      username: ${APP_ADMIN_BOOTSTRAP_USERNAME:admin}
      password: ${APP_ADMIN_BOOTSTRAP_PASSWORD:admin123456}
  wechat:
    enabled: false
    appid:
    secret:
  sms:
    enabled: ${APP_SMS_ENABLED:false}
    code-secret: ${APP_SMS_CODE_SECRET:}
    verification:
      code-length: 6
      ttl-seconds: ${APP_SMS_CODE_TTL_SECONDS:300}
      resend-seconds: ${APP_SMS_RESEND_SECONDS:60}
      max-attempts: ${APP_SMS_MAX_ATTEMPTS:5}
      phone-hour-limit: ${APP_SMS_PHONE_HOUR_LIMIT:5}
      phone-day-limit: ${APP_SMS_PHONE_DAY_LIMIT:10}
      ip-hour-limit: ${APP_SMS_IP_HOUR_LIMIT:20}
    aliyun:
      endpoint: ${APP_SMS_ALIYUN_ENDPOINT:dysmsapi.aliyuncs.com}
      access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
      access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
      sign-name: ${APP_SMS_SIGN_NAME:}
      template-code: ${APP_SMS_TEMPLATE_CODE:}
      template-param-name: ${APP_SMS_TEMPLATE_PARAM_NAME:code}
  phone-one-tap:
    enabled: ${APP_PHONE_ONE_TAP_ENABLED:false}
    allowed-providers: ${APP_PHONE_ONE_TAP_ALLOWED_PROVIDERS:aliyun}
    token-hash-secret: ${APP_PHONE_ONE_TAP_TOKEN_HASH_SECRET:}
    success-retry-window-seconds: ${APP_PHONE_ONE_TAP_SUCCESS_RETRY_WINDOW_SECONDS:30}
    processing-lease-seconds: ${APP_PHONE_ONE_TAP_PROCESSING_LEASE_SECONDS:15}
    attempt-retention-days: ${APP_PHONE_ONE_TAP_ATTEMPT_RETENTION_DAYS:7}
    rate-bucket-retention-hours: ${APP_PHONE_ONE_TAP_RATE_BUCKET_RETENTION_HOURS:2}
    cleanup-cron: ${APP_PHONE_ONE_TAP_CLEANUP_CRON:0 35 3 * * ?}
    connect-timeout-ms: ${APP_PHONE_ONE_TAP_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${APP_PHONE_ONE_TAP_READ_TIMEOUT_MS:3000}
    rate-limit:
      ip-minute-limit: ${APP_PHONE_ONE_TAP_IP_MINUTE_LIMIT:10}
      ip-hour-limit: ${APP_PHONE_ONE_TAP_IP_HOUR_LIMIT:60}
    aliyun:
      endpoint: ${APP_PHONE_ONE_TAP_ALIYUN_ENDPOINT:dypnsapi.aliyuncs.com}
      access-key-id: ${APP_PHONE_ONE_TAP_ALIYUN_ACCESS_KEY_ID:}
      access-key-secret: ${APP_PHONE_ONE_TAP_ALIYUN_ACCESS_KEY_SECRET:}
  hardware:
    enabled: false
    gateway: noop
    http:
      base-url:
      token:
      connect-timeout-ms: 3000
      read-timeout-ms: 5000
  breeding-performance:
    recalc:
      enabled: false
  cage:
    commodity-capacity: 10
  nfc:
    tag-signing:
      active-key-id: ${APP_NFC_TAG_ACTIVE_KEY_ID:1}
      keys: ${APP_NFC_TAG_SIGNING_KEYS:1=cmFiYml0LW5mYy1kZXYtc2lnbmluZy1rZXktY2hhbmdlLW1l}
  mybatis:
    write-guard:
      max-affected-rows: 2000
      ignore-row-limit-ids:
      ignore-no-where-ids:
    select-guard:
      enabled: true
      ignore-ids: com.rabbit.app.modules.house.mapper.RabbitHouseMapper.selectById
  inventory:
    forbid-negative: false
    cas-retry-times: 5

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{traceId}] %msg%n"
