services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rabbit_root
      MYSQL_DATABASE: rabbit_app
      TZ: Asia/Shanghai
    #    ports:
    #      - "3306:3306"
    volumes:
      - rabbit_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-prabbit_root",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7.4-alpine
    profiles: ["redis"]
    ports:
      - "${CACHE_REDIS_BIND_ADDRESS:-127.0.0.1}:${CACHE_REDIS_HOST_PORT:-16380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  valkey:
    image: valkey/valkey:8-alpine
    profiles: ["valkey"]
    ports:
      - "${CACHE_VALKEY_BIND_ADDRESS:-127.0.0.1}:${CACHE_VALKEY_HOST_PORT:-16381}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  backend:
    image: rabbit-backend:java21
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rabbit_app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rabbit_root
      APP_FORWARD_HEADERS_STRATEGY: ${APP_FORWARD_HEADERS_STRATEGY:-none}
      APP_CACHE_PROVIDER: ${APP_CACHE_PROVIDER:-none}
      APP_CACHE_HOST: ${APP_CACHE_HOST:-127.0.0.1}
      APP_CACHE_PORT: ${APP_CACHE_PORT:-6379}
      APP_CACHE_USERNAME: ${APP_CACHE_USERNAME:-}
      APP_CACHE_PASSWORD: ${APP_CACHE_PASSWORD:-}
      APP_CACHE_DATABASE: ${APP_CACHE_DATABASE:-0}
      APP_CACHE_SSL_ENABLED: ${APP_CACHE_SSL_ENABLED:-false}
      APP_CACHE_CONNECT_TIMEOUT: ${APP_CACHE_CONNECT_TIMEOUT:-2s}
      APP_CACHE_COMMAND_TIMEOUT: ${APP_CACHE_COMMAND_TIMEOUT:-1s}
      APP_CACHE_KEY_PREFIX: ${APP_CACHE_KEY_PREFIX:-rabbit:cache:v1}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be configured in .env}
      APP_ADMIN_JWT_SECRET: ${APP_ADMIN_JWT_SECRET:?APP_ADMIN_JWT_SECRET must be configured in .env}
      APP_PHONE_HASH_SECRET: ${APP_PHONE_HASH_SECRET:?APP_PHONE_HASH_SECRET must be configured in .env}
      APP_SMS_ENABLED: ${APP_SMS_ENABLED:-false}
      APP_SMS_CODE_SECRET: ${APP_SMS_CODE_SECRET:-}
      APP_SMS_ALIYUN_ENDPOINT: ${APP_SMS_ALIYUN_ENDPOINT:-dysmsapi.aliyuncs.com}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      APP_SMS_SIGN_NAME: ${APP_SMS_SIGN_NAME:-}
      APP_SMS_TEMPLATE_CODE: ${APP_SMS_TEMPLATE_CODE:-}
      APP_SMS_TEMPLATE_PARAM_NAME: ${APP_SMS_TEMPLATE_PARAM_NAME:-code}
      APP_PHONE_ONE_TAP_ENABLED: ${APP_PHONE_ONE_TAP_ENABLED:-false}
      APP_PHONE_ONE_TAP_ALLOWED_PROVIDERS: ${APP_PHONE_ONE_TAP_ALLOWED_PROVIDERS:-aliyun}
      APP_PHONE_ONE_TAP_TOKEN_HASH_SECRET: ${APP_PHONE_ONE_TAP_TOKEN_HASH_SECRET:-}
      APP_PHONE_ONE_TAP_IP_MINUTE_LIMIT: ${APP_PHONE_ONE_TAP_IP_MINUTE_LIMIT:-10}
      APP_PHONE_ONE_TAP_IP_HOUR_LIMIT: ${APP_PHONE_ONE_TAP_IP_HOUR_LIMIT:-60}
      APP_PHONE_ONE_TAP_CONNECT_TIMEOUT_MS: ${APP_PHONE_ONE_TAP_CONNECT_TIMEOUT_MS:-2000}
      APP_PHONE_ONE_TAP_READ_TIMEOUT_MS: ${APP_PHONE_ONE_TAP_READ_TIMEOUT_MS:-3000}
      APP_PHONE_ONE_TAP_SUCCESS_RETRY_WINDOW_SECONDS: ${APP_PHONE_ONE_TAP_SUCCESS_RETRY_WINDOW_SECONDS:-30}
      APP_PHONE_ONE_TAP_PROCESSING_LEASE_SECONDS: ${APP_PHONE_ONE_TAP_PROCESSING_LEASE_SECONDS:-15}
      APP_PHONE_ONE_TAP_ATTEMPT_RETENTION_DAYS: ${APP_PHONE_ONE_TAP_ATTEMPT_RETENTION_DAYS:-7}
      APP_PHONE_ONE_TAP_RATE_BUCKET_RETENTION_HOURS: ${APP_PHONE_ONE_TAP_RATE_BUCKET_RETENTION_HOURS:-2}
      APP_PHONE_ONE_TAP_CLEANUP_CRON: "${APP_PHONE_ONE_TAP_CLEANUP_CRON:-0 35 3 * * ?}"
      APP_PHONE_ONE_TAP_ALIYUN_ENDPOINT: ${APP_PHONE_ONE_TAP_ALIYUN_ENDPOINT:-dypnsapi.aliyuncs.com}
      APP_PHONE_ONE_TAP_ALIYUN_ACCESS_KEY_ID: ${APP_PHONE_ONE_TAP_ALIYUN_ACCESS_KEY_ID:-}
      APP_PHONE_ONE_TAP_ALIYUN_ACCESS_KEY_SECRET: ${APP_PHONE_ONE_TAP_ALIYUN_ACCESS_KEY_SECRET:-}
      APP_NFC_TAG_ACTIVE_KEY_ID: ${APP_NFC_TAG_ACTIVE_KEY_ID:-1}
      APP_NFC_TAG_SIGNING_KEYS: ${APP_NFC_TAG_SIGNING_KEYS:?APP_NFC_TAG_SIGNING_KEYS must be configured}
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://admin.dzht.top}"
      APP_RELEASE_STORAGE_PATH: ${APP_RELEASE_STORAGE_PATH:-/var/lib/rabbit/app-releases}
      APP_RELEASE_MAX_BYTES: ${APP_RELEASE_MAX_BYTES:-157286400}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      - rabbit_app_releases:/var/lib/rabbit/app-releases
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

volumes:
  rabbit_mysql_data:
  rabbit_app_releases:
