services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rabbit_root
      MYSQL_DATABASE: rabbit_app
      TZ: Asia/Shanghai
    #    ports:
    #      - "3306:3306"
    volumes:
      - rabbit_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-prabbit_root",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  backend:
    image: rabbit-backend:java21
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rabbit_app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rabbit_root
      APP_JWT_SECRET: rabbit-app-prod-secret-change-me
      APP_PHONE_HASH_SECRET: ${APP_PHONE_HASH_SECRET:-rabbit-phone-dev-secret-change-me}
      APP_SMS_ENABLED: ${APP_SMS_ENABLED:-false}
      APP_SMS_CODE_SECRET: ${APP_SMS_CODE_SECRET:-rabbit-sms-dev-secret-change-me}
      APP_SMS_ALIYUN_ENDPOINT: ${APP_SMS_ALIYUN_ENDPOINT:-dysmsapi.aliyuncs.com}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      APP_SMS_SIGN_NAME: ${APP_SMS_SIGN_NAME:-}
      APP_SMS_TEMPLATE_CODE: ${APP_SMS_TEMPLATE_CODE:-}
      APP_SMS_TEMPLATE_PARAM_NAME: ${APP_SMS_TEMPLATE_PARAM_NAME:-code}
      APP_NFC_TAG_ACTIVE_KEY_ID: ${APP_NFC_TAG_ACTIVE_KEY_ID:-1}
      APP_NFC_TAG_SIGNING_KEYS: ${APP_NFC_TAG_SIGNING_KEYS:?APP_NFC_TAG_SIGNING_KEYS must be configured}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,https://admin.dzht.top,https://rabbit.host.dzht.top
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

volumes:
  rabbit_mysql_data:
