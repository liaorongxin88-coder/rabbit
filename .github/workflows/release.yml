name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate_tag:
    name: Validate annotated SemVer tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify tag and main ancestry
        env:
          TAG_NAME: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$(git cat-file -t "refs/tags/$TAG_NAME")" == "tag" ]]
          target_sha="$(git rev-list -n 1 "$TAG_NAME")"
          [[ "$target_sha" == "$EXPECTED_SHA" ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$target_sha" origin/main

  quality:
    name: Release quality gates
    needs: validate_tag
    uses: ./.github/workflows/_quality-gates.yml
    with:
      upload_qa_artifacts: false

  backend_image:
    name: Publish backend image
    needs: quality
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_build-service-image.yml
    with:
      service_name: backend
      context: ./backend
      dockerfile: ./backend/Dockerfile
      image_name: ghcr.io/${{ github.repository_owner }}/rabbit-backend
      version: ${{ github.ref_name }}
      platforms: linux/amd64,linux/arm64

  admin_artifact:
    name: Build Admin release artifact
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG_NAME: ${{ github.ref_name }}
      ADMIN_PROD_API_BASE_URL: ${{ vars.ADMIN_PROD_API_BASE_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.22.0 --activate

      - name: Install from lockfile
        run: pnpm --dir admin install --frozen-lockfile

      - name: Build production bundle
        env:
          VITE_API_BASE_URL: ${{ env.ADMIN_PROD_API_BASE_URL }}
        run: pnpm --dir admin build

      - name: Package and checksum Admin bundle
        run: |
          mkdir -p release
          tar -C admin/dist -czf "release/rabbit-admin-$TAG_NAME.tar.gz" .
          sha256sum "release/rabbit-admin-$TAG_NAME.tar.gz" > release/SHA256SUMS-admin

      - name: Attest Admin bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release/SHA256SUMS-admin

      - name: Upload Admin release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-admin
          path: release/*
          if-no-files-found: error
          retention-days: 30

  android_artifact:
    name: Build signed Android release
    if: vars.APP_RELEASE_ENABLED == 'true'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CI: "true"
      TAG_NAME: ${{ github.ref_name }}
      APP_PROD_API_BASE_URL: ${{ vars.APP_PROD_API_BASE_URL }}
      APP_BUILD_NUMBER_OFFSET: ${{ vars.APP_BUILD_NUMBER_OFFSET }}
      KEYSTORE_BASE64: ${{ secrets.RABBIT_ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.RABBIT_ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.RABBIT_ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.RABBIT_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            app/android/build.gradle
            app/android/settings.gradle
            app/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter 3.24.3
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.24.3
          cache: true

      - name: Prepare production configuration and signing
        id: prepare
        run: |
          [[ "$APP_PROD_API_BASE_URL" =~ ^https://[^[:space:]]+$ ]]
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            [[ -n "$value" ]]
          done
          printf 'RABBIT_BUILD_ENV=prod\nRABBIT_API_BASE_URL=%s\nRABBIT_CARRIER_AUTH_ENABLED=false\n' \
            "$APP_PROD_API_BASE_URL" > app/config/env/prod.env
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rabbit-release.keystore"
          chmod 600 "$RUNNER_TEMP/rabbit-release.keystore"
          build_offset="${APP_BUILD_NUMBER_OFFSET:-4003}"
          [[ "$build_offset" =~ ^[0-9]+$ ]]
          echo "build_number=$((build_offset + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Build signed AAB and APK
        working-directory: app
        env:
          RABBIT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/rabbit-release.keystore
          RABBIT_ANDROID_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          RABBIT_ANDROID_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          RABBIT_ANDROID_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          BUILD_NUMBER: ${{ steps.prepare.outputs.build_number }}
        run: |
          version_name="${TAG_NAME#v}"
          build_number="$BUILD_NUMBER"
          ./rabbit release aab "--build-name=$version_name" "--build-number=$build_number"
          ./rabbit apk prod --release \
            "--build-name=$version_name" \
            "--build-number=$build_number" \
            "--split-debug-info=build/symbols/prod"

      - name: Package and checksum Android artifacts
        env:
          BUILD_NUMBER: ${{ steps.prepare.outputs.build_number }}
        run: |
          mkdir -p release
          cp app/build/app/outputs/bundle/prodRelease/app-prod-release.aab "release/rabbit-app-$TAG_NAME.aab"
          cp app/build/app/outputs/flutter-apk/app-prod-release.apk "release/rabbit-app-$TAG_NAME.apk"
          tar -C app/build/symbols/prod -czf "release/rabbit-app-symbols-$TAG_NAME.tar.gz" .
          sha256sum \
            "release/rabbit-app-$TAG_NAME.aab" \
            "release/rabbit-app-$TAG_NAME.apk" \
            "release/rabbit-app-symbols-$TAG_NAME.tar.gz" \
            > release/SHA256SUMS-android
          apk="release/rabbit-app-$TAG_NAME.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          [[ -x "$apksigner" && -x "$aapt" ]]
          "$apksigner" verify --verbose --print-certs "$apk"
          badging="$("$aapt" dump badging "$apk")"
          package_name="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$badging")"
          version_name="$(sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p" <<<"$badging")"
          version_code="$(sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p" <<<"$badging")"
          [[ "$package_name" == "com.rabbit.app.flutter" ]]
          [[ "$version_name" == "${TAG_NAME#v}" ]]
          [[ "$version_code" == "$BUILD_NUMBER" ]]

      - name: Attest Android artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release/SHA256SUMS-android

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-android
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/rabbit-release.keystore"

  publish_release:
    name: Publish GitHub release
    needs:
      - validate_tag
      - backend_image
      - admin_artifact
      - android_artifact
    if: >-
      always() &&
      needs.validate_tag.result == 'success' &&
      needs.backend_image.result == 'success' &&
      needs.admin_artifact.result == 'success' &&
      (needs.android_artifact.result == 'success' || needs.android_artifact.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG_NAME: ${{ github.ref_name }}
      BACKEND_IMAGE: ${{ needs.backend_image.outputs.image }}
      BACKEND_DIGEST: ${{ needs.backend_image.outputs.digest }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Write release notes
        run: |
          cat > release-notes.md <<EOF
          该版本由注解 SemVer 标签触发，并通过仓库质量门禁。

          后端镜像：\`$BACKEND_IMAGE@$BACKEND_DIGEST\`
          源码提交：\`${GITHUB_SHA}\`

          生产部署如已启用，将直接使用上面的镜像 digest，不会重新构建。
          EOF

      - name: Create or update GitHub release
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/* --clobber
            gh release edit "$TAG_NAME" --title "$TAG_NAME" --notes-file release-notes.md
          else
            gh release create "$TAG_NAME" release/* --verify-tag --title "$TAG_NAME" --notes-file release-notes.md
          fi

  deploy_backend:
    name: Deploy backend to production
    if: vars.BACKEND_AUTO_DEPLOY == 'true'
    needs:
      - backend_image
      - publish_release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.BACKEND_PUBLIC_URL }}
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_BACKUP_PATH: ${{ vars.DEPLOY_BACKUP_PATH }}
      DEPLOY_PUBLIC_URL: ${{ vars.BACKEND_PUBLIC_URL }}
      DEPLOY_ROLLBACK_MODE: ${{ vars.BACKEND_ROLLBACK_MODE || 'manual' }}
      DEPLOY_REGISTRY_USERNAME: ${{ secrets.DEPLOY_GHCR_USERNAME }}
      DEPLOY_REGISTRY_TOKEN: ${{ secrets.DEPLOY_GHCR_TOKEN }}
      BACKEND_IMAGE: ${{ needs.backend_image.outputs.image }}@${{ needs.backend_image.outputs.digest }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare pinned SSH trust
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS_VALUE: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          [[ -n "$DEPLOY_SSH_KEY_VALUE" ]]
          [[ -n "$DEPLOY_KNOWN_HOSTS_VALUE" ]]
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS_VALUE" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_KEY_VALUE" > "$RUNNER_TEMP/deploy-key"
          chmod 600 "$RUNNER_TEMP/deploy-key"

      - name: Activate immutable backend image
        env:
          DEPLOY_SSH_KEY: ${{ runner.temp }}/deploy-key
          DEPLOY_EVIDENCE_FILE: ${{ runner.temp }}/backend-deploy-evidence.txt
        run: ./deploy/scripts/deploy-backend.sh

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-deploy-${{ github.ref_name }}
          path: ${{ runner.temp }}/backend-deploy-evidence.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Remove SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy-key"
