name: Reusable service image build

on:
  workflow_call:
    inputs:
      service_name:
        description: Stable service identifier used in labels and job output.
        required: true
        type: string
      context:
        description: Docker build context relative to the repository root.
        required: true
        type: string
      dockerfile:
        description: Dockerfile relative to the repository root.
        required: true
        type: string
      image_name:
        description: Fully qualified GHCR image name without a tag.
        required: true
        type: string
      version:
        description: Immutable release or candidate tag.
        required: true
        type: string
      platforms:
        description: Comma-separated OCI platforms.
        required: false
        default: linux/amd64
        type: string
    outputs:
      image:
        description: Lowercase fully qualified image name.
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: OCI manifest digest returned by Buildx.
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ inputs.service_name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate image coordinates
        id: image
        env:
          RAW_IMAGE_NAME: ${{ inputs.image_name }}
          RAW_VERSION: ${{ inputs.version }}
        run: |
          image_name="${RAW_IMAGE_NAME,,}"
          [[ "$image_name" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]
          [[ "$RAW_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          echo "name=$image_name" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing immutable version
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_VERSION: ${{ inputs.version }}
        run: |
          if docker manifest inspect "$IMAGE_NAME:$IMAGE_VERSION" >/dev/null 2>&1; then
            echo "Image version already exists and will not be overwritten: $IMAGE_NAME:$IMAGE_VERSION" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            tech.texasoct.rabbit.service=${{ inputs.service_name }}
          cache-from: type=gha,scope=${{ inputs.service_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}
          provenance: mode=max
          sbom: true

      - name: Attest OCI provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
