name: Publish Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated SemVer release tag
        required: true
        type: string
      build_number:
        description: Android versionCode used by the matching AAB
        required: true
        type: string

concurrency:
  group: publish-android-apk-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish_apk:
    name: Build and publish signed APK
    if: vars.APP_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CI: "true"
      TAG_NAME: ${{ inputs.release_tag }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      APP_PROD_API_BASE_URL: ${{ vars.APP_PROD_API_BASE_URL }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag }}

      - name: Validate immutable release target
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$(git cat-file -t "refs/tags/$TAG_NAME")" == "tag" ]]
          target_sha="$(git rev-list -n 1 "$TAG_NAME")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$target_sha" origin/main
          version_name="${TAG_NAME#v}"
          source_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' app/pubspec.yaml)"
          [[ "$source_version" == "$version_name" ]]
          gh release view "$TAG_NAME" >/dev/null
          existing_assets="$(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')"
          if grep -Fxq "rabbit-app-$TAG_NAME.apk" <<<"$existing_assets"; then
            echo "APK asset already exists for $TAG_NAME" >&2
            exit 1
          fi
          if grep -Fxq "SHA256SUMS-apk" <<<"$existing_assets"; then
            echo "APK checksum asset already exists for $TAG_NAME" >&2
            exit 1
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            app/android/build.gradle
            app/android/settings.gradle
            app/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter 3.24.3
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.24.3
          cache: true

      - name: Prepare production configuration and signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RABBIT_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RABBIT_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RABBIT_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RABBIT_ANDROID_KEY_PASSWORD }}
        run: |
          [[ "$APP_PROD_API_BASE_URL" =~ ^https://[^[:space:]]+$ ]]
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            [[ -n "$value" ]]
          done
          printf 'RABBIT_BUILD_ENV=prod\nRABBIT_API_BASE_URL=%s\nRABBIT_CARRIER_AUTH_ENABLED=false\n' \
            "$APP_PROD_API_BASE_URL" > app/config/env/prod.env
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rabbit-release.keystore"
          chmod 600 "$RUNNER_TEMP/rabbit-release.keystore"

      - name: Build signed APK
        working-directory: app
        env:
          RABBIT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/rabbit-release.keystore
          RABBIT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RABBIT_ANDROID_KEYSTORE_PASSWORD }}
          RABBIT_ANDROID_KEY_ALIAS: ${{ secrets.RABBIT_ANDROID_KEY_ALIAS }}
          RABBIT_ANDROID_KEY_PASSWORD: ${{ secrets.RABBIT_ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.validate.outputs.version_name }}
        run: |
          ./rabbit apk prod --release \
            "--build-name=$VERSION_NAME" \
            "--build-number=$BUILD_NUMBER" \
            "--split-debug-info=build/symbols/prod-apk"

      - name: Package and verify APK
        run: |
          mkdir -p release
          cp app/build/app/outputs/flutter-apk/app-prod-release.apk "release/rabbit-app-$TAG_NAME.apk"
          sha256sum "release/rabbit-app-$TAG_NAME.apk" > release/SHA256SUMS-apk
          apk="release/rabbit-app-$TAG_NAME.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          [[ -x "$apksigner" && -x "$aapt" ]]
          "$apksigner" verify --verbose --print-certs "$apk"
          badging="$("$aapt" dump badging "$apk")"
          package_name="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$badging")"
          version_name="$(sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p" <<<"$badging")"
          version_code="$(sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p" <<<"$badging")"
          [[ "$package_name" == "com.rabbit.app.flutter" ]]
          [[ "$version_name" == "${TAG_NAME#v}" ]]
          [[ "$version_code" == "$BUILD_NUMBER" ]]

      - name: Attest APK
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release/SHA256SUMS-apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-apk-${{ inputs.release_tag }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG_NAME" \
            "release/rabbit-app-$TAG_NAME.apk" \
            release/SHA256SUMS-apk

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/rabbit-release.keystore"
